name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          BASE_PATH: ""

      - name: Publish installer scripts
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/gutzerk/code_chroma/main/install.sh \
            --output ./out/install.sh
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/gutzerk/code_chroma/main/install.ps1 \
            --output ./out/install.ps1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
